<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320">
  <style>
    .cursor { animation: tap 2.4s ease-in-out infinite; }
    .ripple { transform-origin: 303px 158px; animation: ripple 2.4s ease-out infinite; }
    .strike { stroke-dasharray: 150; animation: strike 2.4s ease-out infinite; }
    @keyframes tap { 0%, 100% { transform: translate(16px, 18px); } 35%, 70% { transform: translate(0, 0); } }
    @keyframes ripple { 0%, 35% { transform: scale(.4); opacity: 0; } 45% { opacity: .9; } 75%, 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes strike { 0%, 35% { stroke-dashoffset: 150; } 55%, 100% { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
