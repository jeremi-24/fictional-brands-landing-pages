    <filter id="s" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#5a3010" flood-opacity=".18"/></filter>
  </defs>
  <rect width="400" height="320" fill="url(#bg)"/>
