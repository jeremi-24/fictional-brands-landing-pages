      <rect x="3" y="5" width="26" height="25" rx="6" fill="none" stroke="#10231c" stroke-width="2.5"/>
      <path d="M10 2v6M22 2v6M10 21.5h12" fill="none" stroke="#10231c" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
  <g filter="url(#s)" fill="#fff">
    <rect x="28" y="122" width="76" height="76" rx="22"/><rect x="296" y="122" width="76" height="76" rx="22"/>
  </g>
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path transform="translate(45 139) scale(1.75)" stroke="#1f6fd1" d="M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM3 10h18M8 3v4M16 3v4"/>
