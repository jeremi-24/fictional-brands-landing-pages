    <filter id="s" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#103040" flood-opacity=".18"/></filter>
  </defs>
  <rect width="400" height="320" fill="url(#bg)"/>
  <circle cx="200" cy="160" r="108" fill="none" stroke="#fff" stroke-width="2" opacity=".8"/>
  <!-- calendar and mail flow into Hush -->
  <g class="flow" fill="none" stroke="#10231c" stroke-width="4" stroke-linecap="round">
    <path d="M110 160H150"/><path d="M290 160H250"/>
  </g>
